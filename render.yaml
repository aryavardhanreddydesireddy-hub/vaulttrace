
services:
  - type: web
    name: trustvault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        value: sqlite:////tmp/trustvault.db
      - key: UPLOAD_FOLDER
        value: /tmp/trustvault-uploads
