services:
  - type: web
    name: trustvault
    runtime: python
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_FOLDER
        value: /var/data/vault
    disk:
      name: trustvault-files
      mountPath: /var/data
      sizeGB: 1